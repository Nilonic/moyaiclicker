<!DOCTYPE html>
<html>
  <head>
    <!--meta stuff here-->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'self';
        style-src 'self' https://fonts.googleapis.com;
        font-src https://fonts.gstatic.com;
        img-src 'self' data:;
        connect-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        upgrade-insecure-requests;"
    />
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="style_dark.css" />
    <script src="bundle.js"></script>
    <link rel="icon" href="favicon.ico" />
    <!--as per the V2 rewrite. I decided to compile everything into a module ^.^-->
    <!--anything else here-->
    <title>Moyai Clicker</title>
  </head>
  <body cz-shortcut-listen="false">
    <!--cz-shortcut-listen="false" disables colorzilla shortcut listening-->
    <header>
      <button id="reset">reset</button>
      <button id="dark">dark mode</button>
      <button popovertarget="ach_pg_popover" id="ach_pg">Achievements</button>
      <button id="src">View Source</button>
      <input type="range" id="volume-slider" />
      <div id="verString"></div>
    </header>
    <div id="🗿🗿">
      times you've <img id="moyaiimg" src="./moyai.png" draggable="false" />'d:
      <div id="🗿🗿🗿">0</div>
    </div>
    <div popover id="ach_pg_popover">
      <h2>Achievements</h2>
      <div id="ach_pg_topscroll"></div>
      <!--Will be populated with achievements. ach_pg_ach is an unlocked achievement, whilst ach_pg_locked is a locked achievement-->
      <div id="ach_pg_desc"></div>
      <!--holds the description of the achievement-->
      <button popovertarget="ach_pg_popover" popovertargetaction="hide">
        Close
      </button>
    </div>
    <div id="cookiez">
      Welcome to Moyai Clicker! In order to enhance your
      <img src="./moyai.png" id="moyaiimg" draggable="false" /> experience, we
      use cookies. <button id="cookiez_button">OK</button>
    </div>
  </body>
</html>
